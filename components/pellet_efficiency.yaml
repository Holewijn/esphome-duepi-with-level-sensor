# GitHub: components/pellet_efficiency.yaml

switch:
  - platform: template
    name: "Module: Verbruiks-AI"
    id: ai_schakelaar
    icon: "mdi:brain"
    optimistic: true

sensor:
  # Rekenmodule die het procentuele verbruik omzet naar daadwerkelijke kilo's per uur
  - platform: template
    name: "Actueel Pelletverbruik (Gewicht)"
    id: actueel_verbruik_kgh
    unit_of_measurement: "kg/h"
    accuracy_decimals: 2
    icon: "mdi:fire-trend"
    update_interval: 30s
    lambda: |-
      float procent_per_uur = id(pellet_verbruik).state;
      
      if (std::isnan(procent_per_uur)) {
        return {};
      }

      // Als de kachel uitstaat of het niveau stijgt (vullen), is het verbruik 0
      if (procent_per_uur >= -0.05) {
        return 0.0;
      }

      float daling_positief = std::abs(procent_per_uur);

      // FACTOREN OP BASIS VAN ARTEL CURVA NEXT 8KW:
      // De tank is 13 kg. 1% daling is dus exact 0.13 kg pellets (13 / 100).
      float actuele_kilos_per_uur = daling_positief * 0.13;

      // VEILIGHEIDS-CHECK: Begrens de AI-waarde aan de hand van je fabrieksspecificaties (0.6 - 1.4 kg/h)
      // We bouwen een kleine marge in (max 1.6 kg/h voor opstarten/aansteken)
      if (actuele_kilos_per_uur > 1.6) {
        return 1.4; // Maximaal fabrieksverbruik bij uitschieters
      }

      return actuele_kilos_per_uur;

  # Extra bonus-sensor: Zet het verbruik om naar grammen per minuut (leuk voor live grafieken!)
  - platform: template
    name: "Actueel Pelletverbruik (Gram per Min)"
    id: actueel_verbruik_gmin
    unit_of_measurement: "g/min"
    accuracy_decimals: 0
    icon: "mdi:speedometer"
    update_interval: 30s
    lambda: |-
      float kilos_per_uur = id(actueel_verbruik_kgh).state;
      
      if (std::isnan(kilos_per_uur) || kilos_per_uur <= 0.0) {
        return 0.0;
      }

      // Berekening: (kg * 1000) / 60 minuten
      return (kilos_per_uur * 1000.0) / 60.0;
