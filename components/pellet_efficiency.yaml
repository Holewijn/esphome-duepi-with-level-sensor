# GitHub: components/pellet_efficiency.yaml

switch:
  - platform: template
    name: "Module: Verbruiks-AI"
    id: ai_schakelaar
    icon: "mdi:brain"
    optimistic: true

sensor:
  - platform: template
    name: "Actueel Pelletverbruik (Gewicht)"
    id: actueel_verbruik_kgh
    unit_of_measurement: "kg/h"
    accuracy_decimals: 2
    icon: "mdi:fire-trend"
    update_interval: 30s
    lambda: |-
      // KRIJG ECHTE STATUS VAN DE KACHEL
      std::string status = id(burner_status).state;
      if (status == "Off" || status == "Stove Off" || status == "Uit") {
        return 0.0; // Dwing verbruik naar 0 als de kachel uitstaat!
      }

      float procent_per_uur = id(pellet_verbruik).state;
      if (std::isnan(procent_per_uur) || procent_per_uur >= -0.05) {
        return 0.0;
      }

      float daling_positief = std::abs(procent_per_uur);
      float actuele_kilos_per_uur = daling_positief * 0.13;

      if (actuele_kilos_per_uur > 1.6) return 1.4;
      return actuele_kilos_per_uur;

  - platform: template
    name: "Actueel Pelletverbruik (Gram per Min)"
    id: actueel_verbruik_gmin
    unit_of_measurement: "g/min"
    accuracy_decimals: 0
    icon: "mdi:speedometer"
    update_interval: 30s
    lambda: |-
      // KRIJG ECHTE STATUS VAN DE KACHEL
      std::string status = id(burner_status).state;
      if (status == "Off" || status == "Stove Off" || status == "Uit") {
        return 0.0; // Dwing live verbruik naar 0 als de kachel uitstaat!
      }

      float kilos_per_uur = id(actueel_verbruik_kgh).state;
      if (std::isnan(kilos_per_uur) || kilos_per_uur <= 0.0) {
        return 0.0;
      }
      return (kilos_per_uur * 1000.0) / 60.0;
