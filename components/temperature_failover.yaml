# GitHub: components/temperature_failover.yaml

sensor:
  - platform: homeassistant
    id: externe_kamertemp
    entity_id: ${externe_ha_temperatuursensor}
    internal: true

  - platform: template
    name: "Thermostaat Sturende Temperatuur"
    id: actieve_sturende_temperatuur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:shield-sync"
    update_interval: 10s
    lambda: |-
      float externe_temp = id(externe_kamertemp).state;
      float interne_temp = id(room_temp_stove).state;

      if (!std::isnan(externe_temp) && externe_temp > 0.0) {
        return externe_temp;
      }

      if (!std::isnan(interne_temp) && interne_temp > 0.0) {
        return interne_temp;
      }

      return NAN;

text_sensor:
  # Geeft in Home Assistant aan welke bron momenteel actief is
  - platform: template
    name: "Actieve Temperatuurbron"
    id: actieve_temp_bron
    icon: "mdi:database-marker"
    update_interval: 10s
    lambda: |-
      if (!std::isnan(id(externe_kamertemp).state) && id(externe_kamertemp).state > 0.0) {
        return {"Externe Woonkamersensor (Hoofd)"};
      } else {
        return {"Interne Kachelsensor (Back-up)"};
      }
