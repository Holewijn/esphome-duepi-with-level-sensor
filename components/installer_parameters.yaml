number:
  # PARAMETER: VIJZELTOEVOER TIJDENS ONTSTEKING (Register 0x01)
  - platform: template
    name: "Installer: Vijzel Ontsteking Cyclus"
    id: param_vijzel_ontsteking
    icon: "mdi:screw-lag"
    unit_of_measurement: "s"
    min_value: 0.5
    max_value: 8.0
    step: 0.1
    optimistic: true
    set_action:
      lambda: |-
        // AANGEPAST NAAR id(duepi)
        id(duepi).write_parameter(0x01, (uint8_t)(x * 10.0));
        ESP_LOGD("duepi_installer", "Vijzel Ontsteking bijgesteld naar: %.1f s", x);

  # PARAMETER: VIJZELTOEVOER OP MINIMAAL VERMOGEN / POWER 1 (Register 0x02)
  - platform: template
    name: "Installer: Vijzel Toevoer Power 1"
    id: param_vijzel_p1
    icon: "mdi:speedometer-slow"
    unit_of_measurement: "s"
    min_value: 0.4
    max_value: 4.0
    step: 0.1
    optimistic: true
    set_action:
      lambda: |-
        id(duepi).write_parameter(0x02, (uint8_t)(x * 10.0));
        ESP_LOGD("duepi_installer", "Vijzel Power 1 bijgesteld naar: %.1f s", x);

  # PARAMETER: VIJZELTOEVOER OP MAXIMAAL VERMOGEN / POWER 5 (Register 0x06)
  - platform: template
    name: "Installer: Vijzel Toevoer Power 5"
    id: param_vijzel_p5
    icon: "mdi:speedometer"
    unit_of_measurement: "s"
    min_value: 1.0
    max_value: 7.0
    step: 0.1
    optimistic: true
    set_action:
      lambda: |-
        id(duepi).write_parameter(0x06, (uint8_t)(x * 10.0));
        ESP_LOGD("duepi_installer", "Vijzel Power 5 bijgesteld naar: %.1f s", x);

  # PARAMETER: EXHAUST FAN RPM OP MINIMAAL VERMOGEN / POWER 1 (Register 0x12)
  - platform: template
    name: "Installer: Rookgasfan Toerental Power 1"
    id: param_fan_p1
    icon: "mdi:fan-speed-1"
    unit_of_measurement: "RPM"
    min_value: 1000
    max_value: 2800
    step: 50
    optimistic: true
    set_action:
      lambda: |-
        id(duepi).write_parameter(0x12, (uint8_t)(x / 10.0));
        ESP_LOGD("duepi_installer", "Rookgasfan Power 1 bijgesteld naar: %.0f RPM", x);

  # PARAMETER: EXHAUST FAN RPM OP MAXIMAAL VERMOGEN / POWER 5 (Register 0x16)
  - platform: template
    name: "Installer: Rookgasfan Toerental Power 5"
    id: param_fan_p5
    icon: "mdi:fan-speed-3"
    unit_of_measurement: "RPM"
    min_value: 1500
    max_value: 3000
    step: 50
    optimistic: true
    set_action:
      lambda: |-
        id(duepi).write_parameter(0x16, (uint8_t)(x / 10.0));
        ESP_LOGD("duepi_installer", "Rookgasfan Power 5 bijgesteld naar: %.0f RPM", x);

select:
  # PARAMETER: TUSSENTIJDSE REINIGINGSINTERVAL (Register 0x20)
  - platform: template
    name: "Installer: Tussentijdse Reinigingsinterval"
    id: param_clean_interval
    icon: "mdi:broom"
    options:
      - "20 min"
      - "30 min"
      - "45 min"
      - "60 min"
      - "90 min"
    optimistic: true
    set_action:
      lambda: |-
        uint8_t value = 30;
        if (x == "20 min") value = 20;
        else if (x == "30 min") value = 30;
        else if (x == "45 min") value = 45;
        else if (x == "60 min") value = 60;
        else if (x == "90 min") value = 90;
        
        id(duepi).write_parameter(0x20, value);
        ESP_LOGD("duepi_installer", "Reinigingsinterval bijgesteld naar: %s", x.c_str());
