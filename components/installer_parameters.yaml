select:
  # PARAMETER: TUSSENTIJDSE REINIGINGSINTERVAL (Vast opslaan in EEPROM)
  - platform: template
    name: "Installer: Tussentijdse Reinigingsinterval"
    id: param_clean_interval
    icon: "mdi:broom"
    options:
      - "20 min"
      - "30 min"
      - "45 min"
      - "60 min"
      - "90 min"
    optimistic: true
    restore_value: true
    # ZOWEL initial_value ALS default_target ZIJN HIER VOLLEDIG VERWIJDERD
    set_action:
      - lambda: |-
          if (!id(installer_mode).state) return;
          uint8_t val = 30;
          if (x == "20 min") val = 20;
          else if (x == "30 min") val = 30;
          else if (x == "45 min") val = 45;
          else if (x == "60 min") val = 60;
          else if (x == "90 min") val = 90;
          
          uint8_t data[] = {0x23, 0x20, val};
          id(uart_bus).write_array(data, 3);
      - logger.log:
          format: "Installer: Reinigingsinterval permanent opgeslagen in KACHEL: %s"
          args: [ 'x.c_str()' ]
