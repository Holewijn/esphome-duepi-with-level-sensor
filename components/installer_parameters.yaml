number:
  # PARAMETER: VIJZELTOEVOER TIJDENS ONTSTEKING (Vast opslaan in EEPROM)
  - platform: template
    name: "Installer: Vijzel Ontsteking Cyclus"
    id: param_vijzel_ontsteking
    icon: "mdi:screw-lag"
    unit_of_measurement: "s"
    min_value: 0.5
    max_value: 8.0
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 2.5
    set_action:
      - lambda: |-
          if (!id(installer_mode).state) return;
          // 0x23 is het Duepi EEPROM-schrijfcommando voor registers (afhankelijk van firmware type)
          // Als alternatief dwingen we de kachel de parameter permanent op te slaan:
          uint8_t data[] = {0x23, 0x01, (uint8_t)(x * 10.0)}; 
          id(uart_bus).write_array(data, 3);
      - logger.log:
          format: "Installer: Vijzel Ontsteking permanent opgeslagen in KACHEL: %.1f s"
          args: [ 'x' ]

