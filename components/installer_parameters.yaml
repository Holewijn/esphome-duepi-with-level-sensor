number:
  # PARAMETER: VIJZELTOEVOER TIJDENS ONTSTEKING (Register 0x01)
  - platform: template
    name: "Installer: Vijzel Ontsteking Cyclus"
    id: param_vijzel_ontsteking
    icon: "mdi:screw-lag"
    unit_of_measurement: "s"
    min_value: 0.5
    max_value: 8.0
    step: 0.1
    optimistic: true
    set_action:
      - uart.write:
          id: uart_bus
          data: [0x01, !lambda "return (uint8_t)(x * 10.0);"]
      - logger.log:
          format: "Installer: Vijzel Ontsteking bijgesteld naar: %.1f s"
          args: [ 'x' ]

  # PARAMETER: VIJZELTOEVOER OP MINIMAAL VERMOGEN / POWER 1 (Register 0x02)
  - platform: template
    name: "Installer: Vijzel Toevoer Power 1"
    id: param_vijzel_p1
    icon: "mdi:speedometer-slow"
    unit_of_measurement: "s"
    min_value: 0.4
    max_value: 4.0
    step: 0.1
    optimistic: true
    set_action:
      - uart.write:
          id: uart_bus
          data: [0x02, !lambda "return (uint8_t)(x * 10.0);"]
      - logger.log:
          format: "Installer: Vijzel Power 1 bijgesteld naar: %.1f s"
          args: [ 'x' ]

  # PARAMETER: VIJZELTOEVOER OP MAXIMAAL VERMOGEN / POWER 5 (Register 0x06)
  - platform: template
    name: "Installer: Vijzel Toevoer Power 5"
    id: param_vijzel_p5
    icon: "mdi:speedometer"
    unit_of_measurement: "s"
    min_value: 1.0
    max_value: 7.0
    step: 0.1
    optimistic: true
    set_action:
      - uart.write:
          id: uart_bus
          data: [0x06, !lambda "return (uint8_t)(x * 10.0);"]
      - logger.log:
          format: "Installer: Vijzel Power 5 bijgesteld naar: %.1f s"
          args: [ 'x' ]

  # PARAMETER: EXHAUST FAN RPM OP MINIMAAL VERMOGEN / POWER 1 (Register 0x12)
  - platform: template
    name: "Installer: Rookgasfan Toerental Power 1"
    id: param_fan_p1
    icon: "mdi:fan-speed-1"
    unit_of_measurement: "RPM"
    min_value: 1000
    max_value: 2800
    step: 50
    optimistic: true
    set_action:
      - uart.write:
          id: uart_bus
          data: [0x12, !lambda "return (uint8_t)(x / 10.0);"]
      - logger.log:
          format: "Installer: Rookgasfan Power 1 bijgesteld naar: %.0f RPM"
          args: [ 'x' ]

  # PARAMETER: EXHAUST FAN RPM OP MAXIMAAL VERMOGEN / POWER 5 (Register 0x16)
  - platform: template
    name: "Installer: Rookgasfan Toerental Power 5"
    id: param_fan_p5
    icon: "mdi:fan-speed-3"
    unit_of_measurement: "RPM"
    min_value: 1500
    max_value: 3000
    step: 50
    optimistic: true
    set_action:
      - uart.write:
          id: uart_bus
          data: [0x16, !lambda "return (uint8_t)(x / 10.0);"]
      - logger.log:
          format: "Installer: Rookgasfan Power 5 bijgesteld naar: %.0f RPM"
          args: [ 'x' ]

select:
  # PARAMETER: TUSSENTIJDSE REINIGINGSINTERVAL (Register 0x20)
  - platform: template
    name: "Installer: Tussentijdse Reinigingsinterval"
    id: param_clean_interval
    icon: "mdi:broom"
    options:
      - "20 min"
      - "30 min"
      - "45 min"
      - "60 min"
      - "90 min"
    optimistic: true
    set_action:
      - uart.write:
          id: uart_bus
          data: 
            - 0x20
            - !lambda |-
              if (x == "20 min") return 20;
              if (x == "30 min") return 30;
              if (x == "45 min") return 45;
              if (x == "60 min") return 60;
              if (x == "90 min") return 90;
              return 30;
      - logger.log:
          format: "Installer: Reinigingsinterval bijgesteld naar: %s"
          args: [ 'x.c_str()' ]
