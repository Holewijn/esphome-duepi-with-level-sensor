# All packages used (In jouw eigen repo!)
packages:
  duepi_scripts: !include script.yaml
  duepi_globals: !include globals.yaml
  duepi_sensors: !include sensor.yaml
  duepi_numbers: !include number.yaml
  duepi_switches: !include switch.yaml
  duepi_climate: !include climate.yaml
  duepi_uart_base: !include uart.yaml
  duepi_time: !include time.yaml
  duepi_text: !include text_sensor.yaml
  duepi_binary: !include binary_sensor.yaml
  pellet_brandtijd: !include level_sensor_time.yaml
  kachel_onderhoud: !include stove_maintenance.yaml
