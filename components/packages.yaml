# Zorgt ervoor dat ESPHome de 'duepi' C++ map vanuit de hoofdmap van je project start
external_components:
  - source:
      type: git
      url: https://github.com  # <-- Verander dit naar de korte URL
      ref: main
      source_dir: .            # <-- VOEG DEZE REGEL HIER TOE
    components: [duepi]
