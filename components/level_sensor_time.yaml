switch:
  - platform: template
    name: "Module: Brandtijd Berekening"
    id: brandtijd_schakelaar
    icon: "mdi:clock-check"
    optimistic: true

sensor:
  - platform: template
    name: "Pellet Verbruikssnelheid"
    id: pellet_verbruik
    unit_of_measurement: "%/h"
    accuracy_decimals: 1
    icon: "mdi:gauge"
    update_interval: 60s
    lambda: |-
      static float vorige_waarde = NAN;
      static uint32_t vorige_tijd = 0;
      
      // Haal de huidige status op van je pellet_niveau sensor
      float huidige_waarde = id(pellet_niveau).state; 
      uint32_t huidige_tijd = millis();

      if (std::isnan(huidige_waarde)) {
        return {};
      }

      // Eerste meting initialiseren
      if (std::isnan(vorige_waarde) || vorige_tijd == 0) {
        vorige_waarde = huidige_waarde;
        vorige_tijd = huidige_tijd;
        return 0.0;
      }

      // Bereken het tijdsverschil in uren
      float tijds_verschil_uren = (huidige_tijd - vorige_tijd) / 3600000.0;
      
      // Voorkom delen door nul bij te snelle opeenvolgende metingen
      if (tijds_verschil_uren < 0.005) {
        return id(pellet_verbruik).state;
      }

      // Bereken de verandering per uur (% / uren)
      float verandering_per_uur = (huidige_waarde - vorige_waarde) / tijds_verschil_uren;

      // Sla de huidige waarden op voor de volgende run
      vorige_waarde = huidige_waarde;
      vorige_tijd = huidige_tijd;

      return verandering_per_uur;

text_sensor:
  - platform: template
    name: "Resterende Brandtijd"
    id: resterende_brandtijd
    icon: "mdi:clock-end"
    update_interval: 30s
    lambda: |-
      // 1. Haal de echte branderstatus op met de juiste ID 'burner_status'
      std::string status = id(burner_status).state;
      
      // 2. Als de kachel uitstaat, toon dat dan direct
      if (status == "Off" || status == "Stove Off" || status == "Uit") {
        return {"Kachel staat uit"};
      }

      // 3. Haal de verbruikssnelheid en het huidige procentuele niveau op met 'pellet_niveau'
      float verbruik = id(pellet_verbruik).state; 
      float niveau = id(pellet_niveau).state; 

      if (std::isnan(verbruik) || std::isnan(niveau)) {
        return {"Berekenen..."};
      }

      // 4. Als de kachel aanstaat maar de ultrasone sensor meet heel even geen daling,
      // behoud dan de laatst berekende tijd in plaats van naar 'Kachel staat uit' te springen
      if (verbruik >= -0.01) {
        if (id(resterende_brandtijd).state != "Kachel staat uit" && id(resterende_brandtijd).state != "") {
          return id(resterende_brandtijd).state; 
        }
        return {"Berekenen..."};
      }

      // 5. Bereken de resterende brandtijd op basis van de actuele daling
      float daling_positief = std::abs(verbruik);
      float uren_resterend = niveau / daling_positief;
      
      int hele_uren = int(uren_resterend);
      int minuten = int((uren_resterend - hele_uren) * 60);

      // Formatteer de tijd netjes naar 'Xu Xm'
      char buffer[32];
      sprintf(buffer, "%du %dm", hele_uren, minuten);
      return {buffer};


