esphome:
  name: pelletstove
  friendly_name: "Pelletkachel"
  
  # Zorgt ervoor dat Home Assistant updates direct uit jouw EIGEN GitHub repo controleert
  dashboard_import:
    package_url: github://Holewijn/esphome-duepi-with-level-sensor/pelletstove.yaml@main

esp32:
  board: esp32dev # NodeMCU WROOM 32 met CH340 chip

# ========================================================
# Netwerk- en Beveiligingsinstellingen
# ========================================================
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid1
      password: !secret wifi_password1
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pelletkachel Fallback Hotspot"
    password: "Pelletkachel"
    
logger:
  level: INFO
  baud_rate: 0 #disable logging over uart
  logs:
    uart_debug: NONE

api:
  encryption:
    key: "GENEREER_HIER_EEN_ESPHOME_ENCRYPTION_KEY" # Vul je eigen HA encryptiesleutel in

ota:
  - platform: esphome
    password: "KiesHierEenWachtwoord"

# ========================================================
# Substitutions voor de ESP32 & UART2 pinnen
# ========================================================
substitutions:
  min_temp: "10"    # Minimum temperatuur voor de thermostaat in HA
  max_temp: "35"    # Maximum temperatuur voor de thermostaat in HA
  temp_unit: "°C"   # Temperatuureenheid
  tx_pin_esp: '17'  # Fysieke pin G17 op de ESP32 -> RX kachel
  rx_pin_esp: '16'  # Fysieke pin G16 op de ESP32 -> TX kachel

  externe_ha_temperatuursensor: "sensor.woonkamer_temperatuur" 

# ========================================================
# Live modulaire pakketten inladen uit je EIGEN GitHub repo
# ========================================================
packages:
  duepi:
    url: https://github.com/Holewijn/esphome-duepi-with-level-sensor.git
    file: components/packages.yaml
    ref: main

# ========================================================
# Fysieke Basis Niveausensor & Dynamische HA Kalibratie
# ========================================================
sensor:
  # De fysieke sensor leest de afstand en slaat deze intern op
  - platform: ultrasonic
    trigger_pin: GPIO23  
    echo_pin: GPIO22     
    id: ruwe_afstand_sensor_intern
    internal: true
    update_interval: 60s 
    filters:
      - filter_out: NAN
      - median:
          window_size: 5

  # Het uiteindelijke percentage berekent de ESP32 live op basis van je HA schuifbalken
  - platform: template
    name: "Pelletvoorraad Niveau"
    id: pellet_niveau
    icon: "mdi:heater"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float ruw = id(ruwe_afstand_sensor_intern).state;
      float leeg = id(kalibratie_leeg).state;
      float vol = id(kalibratie_vol).state;

      if (std::isnan(ruw) || ruw <= 0.0) {
        return {};
      }

      if (std::abs(leeg - vol) < 0.01) {
        return 0.0;
      }

      float percentage = ((ruw - leeg) / (vol - leeg)) * 100.0;

      if (percentage < 0.0) percentage = 0.0;
      if (percentage > 100.0) percentage = 100.0;

      return percentage;
