esphome:
  name: pelletstove
  friendly_name: "Pelletkachel"
  min_version: 2026.9.1

esp32:
  board: esp32dev # NodeMCU WROOM 32 met CH340 chip

web_server:
  port: 80
  auth:
    username: cove
    password: !secret pelletstove__web_password

# ========================================================
# Netwerk- en Beveiligingsinstellingen
# ========================================================
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      id: Wifi
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pelletkachel Fallback Hotspot"
    password: "Pelletkachel"

logger:
  level: INFO
  baud_rate: 0 #disable logging over uart
  logs:
    uart_debug: NONE

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_encryption_key

# ========================================================
# Substitutions voor de ESP32 & UART2 pinnen
# ========================================================
substitutions:
  min_temp: "10"    # Minimum temperatuur voor de thermostaat in HA
  max_temp: "35"    # Maximum temperatuur voor de thermostaat in HA
  temp_unit: "°C"   # Temperatuureenheid
  tx_pin_esp: '17'  # Fysieke pin G17 op de ESP32 -> RX kachel
  rx_pin_esp: '16'  # Fysieke pin G16 op de ESP32 -> TX kachel

  externe_ha_temperatuursensor: "sensor.woonkamer_temperatuur" 

# ========================================================
# Live modulaire pakketten inladen uit je EIGEN GitHub repo
# ========================================================
packages:
  duepi_pelletkachel:
    url: https://github.com/Holewijn/esphome-duepi-with-level-sensor
    ref: main
    # We roepen nu het centrale pakketbestand aan die de rest automatisch inlaadt!
    files: [components/packages.yaml] 
    refresh: always

# ========================================================
# Fysieke Basis Niveausensor & Dynamische HA Kalibratie
# ========================================================
sensor:
  # De fysieke sensor leest de afstand nu VEEL rustiger en gefilterd
  - platform: ultrasonic
    trigger_pin: GPIO23  
    echo_pin: GPIO22     
    id: ruwe_afstand_sensor_intern
    internal: true
    # AANGEPAST: Meet nu om de 60 seconden in plaats van elke 10 seconden. 
    # Dit geeft de lucht in de bunker rust en bespaart energie.
    update_interval: 60s
    timeout: 1.0m 
    filters:
      # 1. MEDIAN FILTER: Neemt 7 metingen, sorteert ze en pakt de middelste. 
      # Dit trapt 99% van alle plotselinge 'hoge pieken' direct in de prullenbak!
      - median:
          window_size: 7
          send_every: 1
          send_first_at: 1
      
      # 2. EXPONENTIAL MOVING AVERAGE: Zorgt voor een extreem vloeiende lijn.
      # Een waarde van 0.1 betekent dat een nieuwe meting voor slechts 10% meetelt.
      # Hierdoor stijgt of daalt de sensor heel rustig zonder sprongen.
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1

      # 3. VERWIJDER APART METINGEN (NAN)
      - filter_out: NAN

      # 4. CRITICAL BOUNDARY CHECK: Gooi de bekende 19-meter time-out fouten weg
      - lambda: |-
          if (x > 0.80) {
            return {}; 
          } else {
            return x;
          }

  # Het uiteindelijke percentage berekent de ESP32 live op basis van je HA schuifbalken
  - platform: template
    name: "Pelletvoorraad Gekalibreerd"
    id: pellet_niveau
    icon: "mdi:heater"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s # Ook deze synchroniseren we naar 60s
    lambda: |-
      float ruw = id(ruwe_afstand_sensor_intern).state;
      float leeg = id(kalibratie_leeg).state;
      float vol = id(kalibratie_vol).state;

      if (std::isnan(ruw) || ruw <= 0.0) {
        return {};
      }

      if (std::abs(leeg - vol) < 0.01) {
        return 0.0;
      }

      float percentage = ((ruw - leeg) / (vol - leeg)) * 100.0;

      if (percentage < 0.0) percentage = 0.0;
      if (percentage > 100.0) percentage = 100.0;

      return percentage;
