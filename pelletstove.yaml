esphome:
  name: pelletstove
  friendly_name: "Pelletkachel"
  
  # Zorgt ervoor dat Home Assistant updates direct uit jouw EIGEN GitHub repo controleert
  dashboard_import:
    package_url: github://Holewijn/esphome-duepi-with-level-sensor/pelletstove.yaml@main

esp32:
  board: esp32dev # NodeMCU WROOM 32 met CH340 chip

# ========================================================
# Netwerk- en Beveiligingsinstellingen
# ========================================================
wifi:
  ssid: "JOUW_WIFI_NAAM"          # Vervang door je eigen WiFi netwerknaam
  password: "JOUW_WIFI_WACHTWOORD" # Vervang door je eigen WiFi wachtwoord

  # Handige fallback hotspot als je WiFi wegvalt
  ap:
    ssid: "Pelletkachel Fallback Hotspot"
    password: "PelletKachelPWD"

captcha:

logger:
  level: INFO

api:
  encryption:
    key: "GENEREER_HIER_EEN_ESPHOME_ENCRYPTION_KEY" # Vul je eigen HA encryptiesleutel in

ota:
  - platform: esphome
    password: "KiesHierEenWachtwoord"

# ========================================================
# Substitutions voor de ESP32 & UART2 pinnen
# ========================================================
substitutions:
  min_temp: "10"    # Minimum temperatuur voor de thermostaat in HA
  max_temp: "35"    # Maximum temperatuur voor de thermostaat in HA
  temp_unit: "°C"   # Temperatuureenheid
  tx_pin_esp: '17'  # Fysieke pin G17 op de ESP32 -> RX kachel
  rx_pin_esp: '16'  # Fysieke pin G16 op de ESP32 -> TX kachel

  externe_ha_temperatuursensor: "sensor.woonkamer_temperatuur" 

# ========================================================
# Live inladen uit je EIGEN GitHub repository
# ========================================================
packages:
  duepi_local:
    url: https://github.com
    file: components/packages.yaml
    ref: main

# ========================================================
# HC-SR04 Ultrasone Pellet Niveausensor (Direct op 3.3V)
# ========================================================
sensor:
  - platform: ultrasonic
    trigger_pin: GPIO23  # Fysieke pin G23 / D23
    echo_pin: GPIO22     # Fysieke pin G22 / D22
    name: "Pelletvoorraad Niveau"
    id: pellet_niveau
    icon: "mdi:heater"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s # Meet om de minuut om onnodige data-vervuiling te voorkomen
    
    filters:
      # Filter ongeldige 'NAN' metingen (bijvoorbeeld door opvliegend stof tijdens het vullen)
      - filter_out: NAN
      
      # Neemt het gemiddelde (mediaan) van de laatste 5 metingen tegen schommelingen
      - median:
          window_size: 5
          send_every: 1
          send_at_least: 1
      
      # KALIBRATIE (Aanpassen aan de hand van jouw pelletbunker):
      # Formule: [gemeten afstand in meters] -> [gewenst percentage]
      - calibrate_linear:
          - 0.45 -> 0    # Afstand in meters naar de bodem (leeg)
          - 0.10 -> 100  # Afstand in meters tot de pellets (vol)
          
      # Zorg ervoor dat de sensor door een meetfout nooit buiten de 0% of 100% schiet
      - clamp:
          min_value: 0
          max_value: 100
